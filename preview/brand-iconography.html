<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--cream-50)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:18px 10px}
  .ic{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--navy-900)}
  .ic .lucide{width:26px;height:26px;stroke-width:2}
  .ic span{font-size:10px;color:var(--navy-500)}
  .cap{font-size:11px;color:var(--navy-500);margin-top:18px}
</style></head><body>
  <div class="grid">
    <div class="ic"><i data-lucide="menu"></i><span>menu</span></div>
    <div class="ic"><i data-lucide="navigation"></i><span>navigation</span></div>
    <div class="ic"><i data-lucide="map"></i><span>map</span></div>
    <div class="ic"><i data-lucide="compass"></i><span>compass</span></div>
    <div class="ic"><i data-lucide="archive"></i><span>archive</span></div>
    <div class="ic"><i data-lucide="info"></i><span>info</span></div>
    <div class="ic"><i data-lucide="search"></i><span>search</span></div>
    <div class="ic"><i data-lucide="map-pin"></i><span>map-pin</span></div>
    <div class="ic"><i data-lucide="mic"></i><span>mic</span></div>
    <div class="ic"><i data-lucide="file-text"></i><span>file-text</span></div>
    <div class="ic"><i data-lucide="image"></i><span>image</span></div>
    <div class="ic"><i data-lucide="play"></i><span>play</span></div>
    <div class="ic"><i data-lucide="volume-2"></i><span>volume</span></div>
    <div class="ic"><i data-lucide="clock"></i><span>clock</span></div>
    <div class="ic"><i data-lucide="route"></i><span>route</span></div>
    <div class="ic"><i data-lucide="external-link"></i><span>external</span></div>
    <div class="ic"><i data-lucide="arrow-right"></i><span>arrow</span></div>
    <div class="ic"><i data-lucide="chevron-right"></i><span>chevron</span></div>
    <div class="ic"><i data-lucide="book-marked"></i><span>book</span></div>
    <div class="ic"><i data-lucide="languages"></i><span>languages</span></div>
    <div class="ic"><i data-lucide="type"></i><span>type-size</span></div>
    <div class="ic"><i data-lucide="contrast"></i><span>contrast</span></div>
    <div class="ic"><i data-lucide="x"></i><span>close</span></div>
    <div class="ic"><i data-lucide="sliders-horizontal"></i><span>filter</span></div>
  </div>
  <div class="cap"><b style="color:var(--navy-900)">Lucide</b> — stroke-width 2, runde Linienenden. Solide Füllung nur in Pins &amp; aktiven Tabs. Keine Emoji.</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
