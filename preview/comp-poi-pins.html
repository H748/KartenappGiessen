<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:30px 26px 40px;background:var(--map-land);display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap}
  .item{text-align:center}
  /* teardrop pin */
  .pinwrap{position:relative;display:inline-block;filter:drop-shadow(0 5px 5px rgba(0,25,68,.28))}
  .pin{width:34px;height:34px;border:3px solid var(--cream-50);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center}
  .pin .dot{width:11px;height:11px;border-radius:50%;transform:rotate(45deg)}
  .pin-navy{background:var(--navy-900)} .pin-navy .dot{background:#6b7892}
  .pin-red{background:var(--red-600)} .pin-red .dot{background:#e3a59d}
  .pin-sel{width:48px;height:48px} .pin-sel .dot{width:17px;height:17px}
  .tip{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--navy-900);color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;padding:9px 16px;border-radius:var(--r-pill);box-shadow:var(--sh-2)}
  .lbl{font-size:11px;font-weight:700;color:var(--navy-900);margin-top:16px;background:rgba(252,249,242,.72);padding:3px 9px;border-radius:6px;display:inline-block}
</style></head><body>
  <div class="item"><span class="pinwrap"><span class="pin pin-navy"><span class="dot"></span></span></span><div class="lbl">POI · Standard</div></div>
  <div class="item"><span class="pinwrap"><span class="pin pin-red"><span class="dot"></span></span></span><div class="lbl">POI · gefiltert/aktiv</div></div>
  <div class="item"><span class="pinwrap"><span class="tip">Rödgener Straße</span><span class="pin pin-navy pin-sel"><span class="dot"></span></span></span><div class="lbl">Ausgewählt + Label</div></div>
</body></html>
