<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:22px;display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:152px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);border:1px solid var(--line)}
  .chip{height:74px;display:flex;align-items:flex-end;padding:8px 10px}
  .meta{background:var(--white);padding:8px 10px}
  .name{font-weight:700;font-size:13px;color:var(--navy-900)}
  .hex{font-size:12px;color:var(--navy-500);font-variant-numeric:tabular-nums}
  .role{font-size:11px;color:var(--navy-500);margin-top:2px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--navy-900)"></div><div class="meta"><div class="name">Navy 900</div><div class="hex">#001944</div><div class="role">Primäre Tinte · dunkle Flächen · Pins</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="meta"><div class="name">Navy 700</div><div class="hex">#2A4169</div><div class="role">Sekundär · Labels auf Dunkel</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--red-600)"></div><div class="meta"><div class="name">Brick 600</div><div class="hex">#B02D21</div><div class="role">Marke · primäre Aktion · aktiv</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--red-700)"></div><div class="meta"><div class="name">Brick 700</div><div class="hex">#8F241B</div><div class="role">Gedrückt / Hover</div></div></div>
</body></html>
