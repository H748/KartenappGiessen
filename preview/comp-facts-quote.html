<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--cream-50);display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .facts{background:var(--navy-900);color:var(--on-dark);border-radius:var(--r-lg);padding:20px 22px;min-width:300px;flex:1}
  .facts .eyebrow{color:var(--on-dark-mut);margin-bottom:14px}
  .frow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(252,249,242,.14);gap:16px}
  .frow:last-child{border-bottom:0}
  .frow .k{font-size:13px;color:var(--on-dark-mut)}
  .frow .v{font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff}
  .quote{flex:1;min-width:260px;border-left:3px solid var(--red-600);padding:6px 0 6px 18px}
  .quote p{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:19px;color:var(--navy-900);line-height:1.35}
  .quote cite{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--navy-500);margin-top:10px}
</style></head><body>
  <div class="facts">
    <div class="eyebrow">Daten &amp; Fakten</div>
    <div class="frow"><span class="k">Gründung</span><span class="v">1. September 1950</span></div>
    <div class="frow"><span class="k">Kapazität (max.)</span><span class="v">4.500 Personen</span></div>
    <div class="frow"><span class="k">Status heute</span><span class="v">Erstaufnahme (EAE)</span></div>
  </div>
  <div class="quote">
    <p>„Gießen war mehr als ein Lager; es war eine transitorische Zone, in der Identitäten neu verhandelt wurden.“</p>
    <cite>— Prof. Dr. L. Schmidt, Archiv für Zeitgeschichte</cite>
  </div>
</body></html>
