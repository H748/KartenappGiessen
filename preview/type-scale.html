<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:22px}
  .scale > div{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--line)}
  .scale > div:last-child{border-bottom:0}
  .tok{width:120px;font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-500);flex-shrink:0}
  .px{width:54px;font-size:12px;color:var(--navy-300);font-variant-numeric:tabular-nums;flex-shrink:0}
</style></head><body>
  <div class="scale">
    <div><span class="tok">Display</span><span class="px">34</span><span class="display" style="font-size:34px">Zeitgeschichte</span></div>
    <div><span class="tok">H1 · Title</span><span class="px">28</span><span style="font-family:var(--font-display);font-weight:700;font-size:28px">Erkunden Sie</span></div>
    <div><span class="tok">H2 · Card</span><span class="px">22</span><span style="font-family:var(--font-display);font-weight:700;font-size:22px">Die erste Ankunft</span></div>
    <div><span class="tok">Body</span><span class="px">16</span><span style="font-family:var(--font-body);font-size:16px;color:var(--navy-500)">Fließtext für POI-Beschreibungen</span></div>
    <div><span class="tok">Eyebrow</span><span class="px">12</span><span class="eyebrow">Kuratorische Auswahl</span></div>
  </div>
</body></html>
