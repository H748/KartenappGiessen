<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:22px}

  .bar{background:var(--red-600);border-radius:3px;width:34px}
  .lbl{font-size:11px;font-weight:700;color:var(--navy-900);margin-top:6px}
  .val{font-size:10px;color:var(--navy-500)}
  .cap{font-size:12px;color:var(--navy-500);margin-bottom:14px}
</style></head><body>
  <div class="cap">4-pt Grundraster · konsistente Abstände für Touch-Komfort (Mindest-Hit-Target 44px)</div>

    <div class="item"><div class="bar" style="height:8px"></div><div class="lbl">2</div><div class="val">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="lbl">3</div><div class="val">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="lbl">4</div><div class="val">16</div></div>
    <div class="item"><div class="bar" style="height:20px"></div><div class="lbl">5</div><div class="val">20</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="lbl">6</div><div class="val">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="lbl">8</div><div class="val">32</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="lbl">10</div><div class="val">40</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="lbl">12</div><div class="val">48</div></div>
  </div>
</body></html>
