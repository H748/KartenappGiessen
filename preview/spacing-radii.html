<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:22px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .item{text-align:center}
  .box{background:var(--white);border:1px solid var(--line-strong);width:92px;height:72px}
  .lbl{font-size:11px;font-weight:700;color:var(--navy-900);margin-top:8px}
  .val{font-size:11px;color:var(--navy-500)}
</style></head><body>
  <div class="item"><div class="box" style="border-radius:var(--r-sm)"></div><div class="lbl">sm</div><div class="val">10px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--r-md)"></div><div class="lbl">md · Buttons</div><div class="val">16px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--r-lg)"></div><div class="lbl">lg · Karten</div><div class="val">22px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--r-xl)"></div><div class="lbl">xl · Float</div><div class="val">28px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--r-pill);width:108px"></div><div class="lbl">pill</div><div class="val">999px</div></div>
</body></html>
