<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:22px;display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:152px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);border:1px solid var(--line)}
  .chip{height:74px}
  .meta{background:var(--white);padding:8px 10px}
  .name{font-weight:700;font-size:13px;color:var(--navy-900)}
  .hex{font-size:12px;color:var(--navy-500);font-variant-numeric:tabular-nums}
  .role{font-size:11px;color:var(--navy-500);margin-top:2px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--map-land)"></div><div class="meta"><div class="name">Map Land</div><div class="hex">#B7C2A0</div><div class="role">Salbeigrün · Landfläche</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--map-water)"></div><div class="meta"><div class="name">Map Water</div><div class="hex">#A9C4CF</div><div class="role">Lahn · Gewässer</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--map-road);border-bottom:1px solid var(--line)"></div><div class="meta"><div class="name">Map Road</div><div class="hex">#F3F1E7</div><div class="role">Straßennetz-Linien</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--red-100)"></div><div class="meta"><div class="name">Brick 100</div><div class="hex">#F4D9D4</div><div class="role">AKTIV-Badge · roter Tint</div></div></div>
</body></html>
