<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:0;background:var(--cream-50)}
  .row{display:flex}
  .panel{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 26px;min-height:120px}
  .panel--light{background:var(--white)}
  .panel--cream{background:var(--cream-50)}
  .panel--dark{background:var(--navy-900)}
  .logo{width:100%;max-width:300px;height:auto;display:block}
  .cap{font-size:11px;color:var(--navy-500);text-align:center;padding:8px}
  .divider{height:1px;background:var(--line)}
  /* app wordmark lockup */
  .lockwrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:24px 26px}
  .lockup{display:flex;align-items:center;gap:12px}
  .mark{width:42px;height:42px;border-radius:11px;background:var(--navy-900);color:#fff;display:grid;place-items:center}
  .mark .lucide{width:23px;height:23px}
  .word{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--navy-900);line-height:1}
  .word b{color:var(--red-600)}
</style></head><body>
  <div class="row">
    <div style="flex:1"><div class="panel panel--light"><img class="logo" src="../assets/logo-nal.png" alt="Lern- und Erinnerungsort Notaufnahmelager Gießen"></div><div class="cap">Offizielles Logo · auf Weiß</div></div>
    <div style="flex:1"><div class="panel panel--cream"><img class="logo" src="../assets/logo-nal.png" alt=""></div><div class="cap">auf Cream (App-Papier)</div></div>
  </div>
  <div class="divider"></div>
  <div class="lockwrap">
    <div class="lockup">
      <span class="mark"><i data-lucide="book-marked"></i></span>
      <span class="word">Ankunft: <b>Gießen</b></span>
    </div>
    <span style="font-size:12px;color:var(--navy-500);max-width:260px">App-Wortmarke (Produktname) — ergänzt das institutionelle Logo, ersetzt es nicht.</span>
  </div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
