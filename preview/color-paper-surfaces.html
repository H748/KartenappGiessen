<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:22px;display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:152px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);border:1px solid var(--line)}
  .chip{height:74px}
  .meta{background:var(--white);padding:8px 10px}
  .name{font-weight:700;font-size:13px;color:var(--navy-900)}
  .hex{font-size:12px;color:var(--navy-500);font-variant-numeric:tabular-nums}
  .role{font-size:11px;color:var(--navy-500);margin-top:2px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--cream-50)"></div><div class="meta"><div class="name">Cream 50</div><div class="hex">#FCF9F2</div><div class="role">App-Hintergrund (Papier)</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--cream-100)"></div><div class="meta"><div class="name">Cream 100</div><div class="hex">#F5F2EA</div><div class="role">Alternative Sektion</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-200)"></div><div class="meta"><div class="name">Paper 200</div><div class="hex">#EDECE6</div><div class="role">Schwebende Karten · Vertiefung</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--chip)"></div><div class="meta"><div class="name">Chip</div><div class="hex">#E5E2DB</div><div class="role">Chips · sekundäre Buttons</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div><div class="role">Erhabene Inhaltskarten</div></div></div>
</body></html>
