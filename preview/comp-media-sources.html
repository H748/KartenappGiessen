<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--cream-50);display:flex;flex-direction:column;gap:10px}
  .src{display:flex;align-items:center;gap:13px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh-1);max-width:600px}
  .ic{width:38px;height:38px;border-radius:10px;background:var(--cream-100);display:grid;place-items:center;color:var(--navy-900);flex-shrink:0}
  .ic .lucide{width:19px;height:19px}
  .txt{flex:1;font-weight:600;font-size:15px;color:var(--navy-900)}
  .ext{color:var(--navy-300)}
  .ext .lucide{width:17px;height:17px}
  .audio{display:flex;align-items:center;gap:13px;background:var(--white);border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--sh-1);max-width:600px}
  .play{width:42px;height:42px;border-radius:50%;background:var(--navy-900);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .play .lucide{width:18px;height:18px}
  .abar{flex:1;height:4px;background:var(--line-strong);border-radius:2px;position:relative}
  .abar::after{content:"";position:absolute;left:0;top:0;height:4px;width:42%;background:var(--red-600);border-radius:2px}
  .time{font-size:12px;color:var(--navy-500);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="audio">
    <div class="play"><i data-lucide="play"></i></div>
    <div class="abar"></div>
    <span class="time">02:18 / 05:10</span>
    <i data-lucide="volume-2" style="color:var(--navy-500);width:18px;height:18px"></i>
  </div>
  <div class="src"><span class="ic"><i data-lucide="file-text"></i></span><span class="txt">Aufnahmeprotokolle 1953</span><span class="ext"><i data-lucide="external-link"></i></span></div>
  <div class="src"><span class="ic"><i data-lucide="archive"></i></span><span class="txt">Stadtarchiv Gießen, Best. 402</span><span class="ext"><i data-lucide="external-link"></i></span></div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
