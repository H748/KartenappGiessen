  <script>
    /* Fit the fixed 390×844 phone frame into any viewport (width & height).
       Replaces a CSS calc() that produced an invalid unit and disabled
       scaling, which clipped fixed controls on short viewports. */
    (function () {
      var BASE_W = 390, BASE_H = 844, MARGIN = 24;
      function fit() {
        var p = document.querySelector(".phone");
        if (!p) return;
        var s = Math.min(
          1,
          (window.innerHeight - MARGIN) / BASE_H,
          (window.innerWidth - MARGIN) / BASE_W
        );
        p.style.setProperty("--phone-scale", s);
      }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", fit);
      // React mounts asynchronously — run for a few frames to catch first paint.
      var n = 0;
      (function tick() { fit(); if (n++ < 40) requestAnimationFrame(tick); })();
    })();
  </script>
</body>
